# lefthook 設定。導入: `lefthook install`（要 lefthook バイナリ）。
# 手動実行は Makefile（make test / make check）を参照。

pre-commit:
  parallel: true
  commands:
    # チェッカー自体のユニットテスト（ゼロ依存・高速・常にグリーン）
    unit-tests:
      run: python3 -m unittest discover -s scripts -t scripts -p 'test_*.py'

pre-push:
  commands:
    unit-tests:
      run: python3 -m unittest discover -s scripts -t scripts -p 'test_*.py'
    # ドキュメント整合性チェック（error で push を止める。warning は通す）。
    doc-check:
      run: python3 scripts/check.py
