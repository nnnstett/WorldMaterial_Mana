  <text x="832" y="438" transform="rotate(-24.4 832 438)" text-anchor="middle" class="h" font-size="23" fill="#7d5411">現化</text>
  <text x="580" y="630" transform="rotate(-24.4 580 630)" text-anchor="middle" class="h" font-size="23" fill="#3e4565">真化</text>
  <text x="310" y="668" text-anchor="middle" class="h" font-size="21" fill="#5a3b0a">マナ</text>
  <text x="654" y="440" text-anchor="middle" class="h" font-size="21" fill="#201f1d">魂</text>
  <text x="1130" y="280" text-anchor="middle" class="b" font-size="14" fill="#2f3450">物質・物理エネルギー</text>
  <text x="1038" y="398" text-anchor="middle" class="b" font-size="14" fill="#2f3450">瘴気</text>
  <text x="56" y="80" class="h1" font-size="46" letter-spacing="0.9" fill="#201f1d">真化と現化</text>
  <g class="b" font-size="12.5" fill="#605d5d">
    <text x="56" y="166">いずれも精神エネルギーが魂方向に引き寄せる力</text>
    <text x="56" y="188.5">で駆動するイメージ</text>
    <text x="56" y="221">※一人の行使者からの視点</text>
    <text x="56" y="253.5">※縦/横軸・傾きは視覚的なイメージとしての記</text>
    <text x="56" y="276">載であり、その大きさに意味は持たない</text>
  </g>
  <g>
    <rect x="56" y="340" width="320" height="252" fill="#f8f4f4" stroke="rgba(32,31,29,0.16)"></rect>
    <text x="76" y="375" class="h" font-size="21" fill="#201f1d">現化</text>
    <line x1="130" y1="368" x2="150" y2="368" stroke="#b68235" stroke-width="2.2"></line>
    <path d="M148 363 L156 368 L148 373" fill="none" stroke="#b68235" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
    <rect x="76" y="391" width="26" height="2" fill="#b68235"></rect>
    <g class="b" font-size="13" fill="#201f1d">
      <text x="76" y="420">自然現化はあふれ出るイメージ（魂があ</text>
      <text x="76" y="443.4">る必要はない）</text>
      <text x="76" y="475">共鳴現化は「精神エネルギーが、魂を起</text>
      <text x="76" y="498.4">点に引き上げる（現化）＋押し上げる</text>
      <text x="76" y="521.8">（存在強度）」イメージ。魂の形・精神</text>
      <text x="76" y="545.2">エネルギーの方向性によって現化しやす</text>
      <text x="76" y="568.6">い物質・物理エネルギーが変わる</text>
    </g>
  </g>
  <g>
    <rect x="880" y="628" width="420" height="256" fill="#f8f4f4" stroke="rgba(32,31,29,0.16)"></rect>
    <text x="900" y="663" class="h" font-size="21" fill="#201f1d">真化</text>
    <path d="M962 651 L954 656 L962 661" fill="none" stroke="#3e4565" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
    <line x1="960" y1="656" x2="984" y2="656" stroke="#3e4565" stroke-width="2.2"></line>
    <rect x="900" y="679" width="26" height="2" fill="#3e4565"></rect>
    <g class="b" font-size="13" fill="#201f1d">
      <text x="900" y="708">現在の裏付けを瘴気の結合力が上回ればマナに戻る</text>
      <text x="900" y="739">自然真化は裏付けがごく小さい物質・物理エネルギーが瘴気と</text>
      <text x="900" y="762.4">くっついて転がり落ちるイメージ（魂がある必要はない）</text>
      <text x="900" y="793">共鳴真化は「精神エネルギーが、魂を起点に引き下げる」</text>
      <text x="900" y="816.4">イメージ（瘴気と物質・物理エネルギーが結びつく力（＝</text>
      <text x="900" y="839.8">還元力）を強化する）。魂の形・精神エネルギーの方向性</text>
      <text x="900" y="863.2">によって結びつきやすい対象が変わる</text>
    </g>
  </g>
